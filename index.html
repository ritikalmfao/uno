
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UNO vs Computer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>UNO vs Computer</h1>

    <div class="game-container">

        <div class="computer-area">
            <h2>Computer</h2>
            <div id="computer-count">Cards: 7</div>
        </div>

        <div class="center-area">

            <div class="pile-section">

                <div class="pile" id="draw-pile">
                    DRAW
                </div>

             <div class="pile" id="discard-pile">
    ?
</div>

<div id="current-color"></div>

            </div>

            <div id="status">
                Your Turn
            </div>

        </div>

        <div class="player-area">
            <h2>You</h2>

            <div id="player-hand"></div>
        </div>

    </div>

    <button id="draw-btn">
        Draw Card
    </button>

    <script src="script.js"></script>

</body>
</html>
